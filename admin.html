<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - APSAN, LDA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">APSAN — Backoffice de Validação</h1>
            <a href="index.html" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded text-white font-medium">Ver Site Público</a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        <h2 class="text-xl font-bold mb-4 text-slate-800">Fila de Comprovativos Pendentes (Validação em até 1h)</h2>
        
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-600 uppercase tracking-wider">
                            <th class="p-4">Paciente</th>
                            <th class="p-4">Contacto</th>
                            <th class="p-4">Médico / Especialidade</th>
                            <th class="p-4">Data Pretendida</th>
                            <th class="p-4">Comprovativo</th>
                            <th class="p-4">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body" class="divide-y divide-slate-200 text-sm">
                        <!-- Os dados entram aqui dinamicamente -->
                    </tbody>
                </table>
            </div>
            <div id="no-data" class="p-8 text-center text-slate-500 hidden">
                Não existem marcações pendentes de validação neste momento.
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
