<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - APSAN, LDA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">APSAN — Backoffice de Validação</h1>
            <div class="space-x-2">
                <button onclick="exportToPDF()" class="text-xs bg-blue-600 hover:bg-blue-700 px-3 py-2 rounded text-white font-medium">📄 Exportar PDF</button>
                <a href="index.html" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded text-white font-medium">Ver Site Público</a>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <h2 class="text-xl font-bold mb-4 text-slate-800">Fila de Comprovativos e Gestão de Observações</h2>
        
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-600 uppercase tracking-wider">
                            <th class="p-4">Paciente / Contacto</th>
                            <th class="p-4">Local / Clínica / Médico</th>
                            <th class="p-4">Data</th>
                            <th class="p-4">Comprovativo</th>
                            <th class="p-4">Observação da Equipa (Admin)</th>
                            <th class="p-4">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body" class="divide-y divide-slate-200 text-sm">
                        <!-- Dados dinâmicos -->
                    </tbody>
                </table>
            </div>
            <div id="no-data" class="p-8 text-center text-slate-500 hidden">
                Não existem registos de marcações neste momento.
            </div>
        </div>
    </main>

    <!-- Modal para ver o Comprovativo em Zoom -->
    <div id="receipt-modal" class="fixed inset-0 bg-black bg-opacity-70 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white p-4 rounded-xl max-w-2xl w-full text-center relative">
            <h3 class="font-bold text-lg mb-3">Comprovativo Submetido</h3>
            <div id="modal-content-area" class="mb-4 max-h-[70vh] overflow-auto flex justify-center">
                <!-- Imagem injetada aqui -->
            </div>
            <button onclick="closeModal()" class="bg-slate-800 text-white px-4 py-2 rounded text-sm font-semibold">Fechar</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
